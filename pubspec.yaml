name: my_app
description: "ADRDE Professional Secure Chat Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Material Design
  cupertino_icons: ^1.0.8
  material_color_utilities: ^0.11.1

  # HTTP & API Communication
  http: ^1.2.0
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Real-time Communication
  socket_io_client: ^2.0.3+1

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  equatable: ^2.0.5

  # Local Storage & Security
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Network & Connectivity
  connectivity_plus: ^6.1.4

  # File Handling & Media
  file_picker: ^8.0.0+1
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  mime: ^1.0.4
  open_file: ^3.3.2

  # UI Components & Animations
  flutter_staggered_animations: ^1.1.1
  lottie: ^2.7.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  timeago: ^3.6.1
  url_launcher: ^6.2.4

  # Cryptography & Security
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  rsa_encrypt: ^2.0.0
  cryptography: ^2.7.0

  # Desktop specific
  window_manager: ^0.3.8
  bitsdojo_window: ^0.1.6

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Media & Images
  photo_view: ^0.14.0
  flutter_svg: ^2.0.9

  # Form validation
  email_validator: ^2.1.17

  # Navigation
  go_router: ^13.2.0

  # Additional
  path: ^1.8.3
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http_mock_adapter: ^0.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
